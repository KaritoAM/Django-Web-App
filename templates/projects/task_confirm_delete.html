{% extends "base.html" %}
{% block title %}Eliminar tarea{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h4 class="mb-3">¿Eliminar la tarea "{{ object.titulo }}"?</h4>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'project_detail' object.proyecto.pk %}" class="btn btn-outline-secondary">
            Cancelar
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
